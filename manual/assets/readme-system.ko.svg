<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc" xml:lang="ko"><title id="title">작업 파일과 Colvia 기록의 저장 위치</title><desc id="desc">프로젝트 폴더에는 현재 파일과 선택한 Git 저장소가 있습니다. Colvia는 별도 사용자 데이터 폴더의 프로젝트별 SQLite 데이터베이스에 승인과 제출본, 결정을 보관합니다. git push로는 커밋한 이력을 원격에 보냅니다.</desc>
<style>
.bg{fill:#FAF9F6}.frame{fill:none;stroke:#E4E0D8}
.ink{fill:#2B2A27}.mut{fill:#6B675F}
.ln{fill:none;stroke:#9C968B;stroke-width:1.6}.lnd{fill:none;stroke:#B9B3A8;stroke-width:1.4;stroke-dasharray:5 5}
.ah{fill:#9C968B}
.agent{fill:#EEEBE4;stroke:#CFC9BE;stroke-width:1.2}
.col{fill:#1F5F5B}.colt{fill:#FFFFFF}.sym{fill:none;stroke:#FFFFFF;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.work{fill:#FFFFFF;stroke:#1F5F5B;stroke-width:1.6}.workt{fill:#1F5F5B}
.rec{fill:#E3EEEC;stroke:#1F5F5B;stroke-width:1.4}
.dec{fill:#D9822B}.dect{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{fill:#FFFFFF;stroke:#CFC9BE;stroke-width:1.2}
.icon{fill:none;stroke:#2B2A27;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconf{fill:#2B2A27}
@media (prefers-color-scheme: dark){
.bg{fill:#22262A}.frame{stroke:#363B40}
.ink{fill:#ECE6DA}.mut{fill:#A9A397}
.ln{stroke:#8A857C}.lnd{stroke:#5F5B55}.ah{fill:#8A857C}
.agent{fill:#30353A;stroke:#4A5056}
.col{fill:#8CC6BC}.colt{fill:#13201E}.sym{stroke:#13201E}
.work{fill:#2A2F33;stroke:#8CC6BC}.workt{fill:#8CC6BC}
.rec{fill:#253330;stroke:#8CC6BC}
.dec{fill:#F0A35E}.dect{stroke:#22262A}
.note{fill:#2A2F33;stroke:#4A5056}
.icon{stroke:#ECE6DA}.iconf{fill:#ECE6DA}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ah"/></marker></defs>
<rect x="1" y="1" width="758" height="288" rx="16" class="bg"/>
<rect x="1" y="1" width="758" height="288" rx="16" class="frame"/>
<rect x="20" y="20" width="335" height="160" rx="8" class="note"/>
<rect x="375" y="20" width="365" height="262" rx="8" class="rec"/>
<text x="187" y="48" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" class="ink">프로젝트 폴더</text>
<text x="187" y="84" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" class="ink">현재 파일</text>
<text x="187" y="111" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" class="mut">문서 · 코드 · 프로젝트 규칙</text>
<text x="187" y="150" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" class="workt">Git 저장소 (선택)</text>
<text x="558" y="48" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" class="workt">내 기기의 사용자 데이터 폴더</text>
<text x="558" y="87" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" class="workt">Colvia 기록</text>
<text x="558" y="119" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="400" class="ink">승인한 범위 · 제출본</text>
<text x="558" y="149" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="400" class="ink">수락 · 수정 요청</text>
<path d="M187 182 V229" class="ln" marker-end="url(#ah)"/>
<text x="248" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" class="mut">git push</text>
<rect x="41" y="236" width="292" height="38" rx="8" class="agent"/>
<text x="187" y="255" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" class="ink">원격 Git 저장소 · 커밋한 이력</text>
<text x="558" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" class="workt">git push로 올라가지 않습니다</text>
<rect x="398" y="236" width="318" height="38" rx="8" class="work"/>
<path transform="translate(0 8)" d="M418 240 C418 235 439 235 439 240 V254 C439 259 418 259 418 254 Z M418 240 C418 245 439 245 439 240" class="icon"/>
<text x="566" y="255" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" class="workt">프로젝트별 DB (SQLite)</text>
</svg>
