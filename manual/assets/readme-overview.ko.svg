<path d="M222 88 H258" class="ln" marker-end="url(#ah)"/>
<circle cx="282" cy="81" r="7" class="iconf"/>
<path d="M270 103 Q270 90 282 90 Q294 90 294 103 Z" class="iconf"/>
<text x="282" y="130" class="ink" font-size="13.5" font-weight="400" text-anchor="middle">나</text>
<rect x="304" y="68" width="150" height="40" rx="9" class="note"/>
<text x="379.0" y="93.0" class="ink" font-size="13.5" font-weight="500" text-anchor="middle">“Colvia 연결해 줘”</text>
<path d="M454 88 H490" class="ln" marker-end="url(#ah)"/>
<rect x="492" y="66" width="168" height="44" rx="9" class="agent"/>
<text x="576.0" y="93.0" class="ink" font-size="14" font-weight="500" text-anchor="middle">Codex · Claude Code</text>
