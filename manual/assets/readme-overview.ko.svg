<rect x="698" y="68" width="104" height="40" rx="9" class="col"/>
<g transform="translate(710.0,79.0) scale(0.2812)"><path d="M27.9 45.7 A14 14 0 1 1 22 19 C29 19 31 30 36.5 30 C42 30 44 21 49.5 21 L56 21" class="sym"/></g>
<text x="761.0" y="93.0" class="colt" font-size="14" font-weight="600" text-anchor="middle">Colvia</text>
<path d="M802 88 H816" class="ln" marker-end="url(#ah)"/>
<rect x="821" y="59" width="124" height="58" rx="8" class="work"/>
<text x="883" y="77" text-anchor="middle" dominant-baseline="central" class="ink" font-size="14" font-weight="600">미리보기 확인</text>
<text x="883" y="100" text-anchor="middle" dominant-baseline="central" class="workt" font-size="12" font-weight="600">연결 승인</text>
<path d="M884 119 V146 Q884 153 877 153 H103 Q95 153 95 161 V166" class="lnd" marker-end="url(#ah)"/>
<path d="M27 182 H18 Q12 182 12 188 V369 Q12 375 18 375 H24" class="ln" marker-end="url(#ah)"/>
<path d="M12 241 H24" class="ln" marker-end="url(#ah)"/>
<circle cx="12" cy="241" r="2.3" class="ah"/>
<rect x="27" y="169" width="137" height="26" rx="8" class="rec"/>
<text x="95.5" y="182" text-anchor="middle" dominant-baseline="central" class="workt" font-size="16" font-weight="700">연결한 뒤에는</text>
<rect x="27" y="213" width="137" height="56" rx="8" class="work"/>
<text x="95.5" y="230" text-anchor="middle" dominant-baseline="central" class="workt" font-size="15" font-weight="600">새 일 맡기기</text>
<text x="95.5" y="253" text-anchor="middle" dominant-baseline="central" class="mut" font-size="12" font-weight="400">하려는 일 말하기</text>
<rect x="197" y="213" width="160" height="56" rx="8" class="note"/>
<text x="277.0" y="230" text-anchor="middle" dominant-baseline="central" class="ink" font-size="15" font-weight="600">범위 승인</text>
<text x="277.0" y="253" text-anchor="middle" dominant-baseline="central" class="mut" font-size="12" font-weight="400">제안받은 계획</text>
<rect x="390" y="213" width="160" height="56" rx="8" class="agent"/>
<text x="470.0" y="230" text-anchor="middle" dominant-baseline="central" class="ink" font-size="15" font-weight="600">작업 · 검사</text>
<text x="470.0" y="253" text-anchor="middle" dominant-baseline="central" class="mut" font-size="12" font-weight="400">검토용 제출</text>
<rect x="583" y="213" width="160" height="56" rx="8" class="work"/>
<text x="663.0" y="230" text-anchor="middle" dominant-baseline="central" class="workt" font-size="15" font-weight="600">결과 검토</text>
<text x="663.0" y="253" text-anchor="middle" dominant-baseline="central" class="mut" font-size="12" font-weight="400">수락 또는 수정 요청</text>
<rect x="776" y="213" width="159" height="56" rx="8" class="note"/>
<text x="855.5" y="230" text-anchor="middle" dominant-baseline="central" class="ink" font-size="15" font-weight="600">수락</text>
<text x="855.5" y="253" text-anchor="middle" dominant-baseline="central" class="mut" font-size="12" font-weight="400">다음 일은 선택</text>
<path d="M166 241 h25" class="ln" marker-end="url(#ah)"/>
<path d="M359 241 h25" class="ln" marker-end="url(#ah)"/>
<path d="M552 241 h25" class="ln" marker-end="url(#ah)"/>
<path d="M745 241 h25" class="ln" marker-end="url(#ah)"/>
<path d="M662 271 V291 Q662 298 655 298 H477 Q470 298 470 291 V274" class="ln" marker-end="url(#ah)"/>
<text x="566" y="315" text-anchor="middle" dominant-baseline="central" class="mut" font-size="13" font-weight="400">수정 요청</text>
<path d="M28 336 H932" class="frame"/>
<rect x="27" y="352" width="137" height="46" rx="8" class="work"/>
<text x="95" y="375" text-anchor="middle" dominant-baseline="central" class="workt" font-size="15" font-weight="600">하던 일 이어가기</text>
<path d="M166 375 H189" class="ln" marker-end="url(#ah)"/>
<rect x="197" y="352" width="257" height="46" rx="8" class="note"/>
<text x="325" y="375" text-anchor="middle" dominant-baseline="central" class="ink" font-size="14" font-weight="600">“오늘 내가 볼 건 뭐지?”</text>
<path d="M456 375 H480" class="ln" marker-end="url(#ah)"/>
<rect x="489" y="352" width="225" height="46" rx="8" class="note"/>
<text x="601" y="375" text-anchor="middle" dominant-baseline="central" class="ink" font-size="14" font-weight="600">검토할 일 · 고칠 일 확인</text>
<path d="M716 375 H738" class="ln" marker-end="url(#ah)"/>
<text x="839" y="375" text-anchor="middle" dominant-baseline="central" class="workt" font-size="14" font-weight="600">같은 Work에서 계속</text>
</svg>
