<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">처음 한 번 연결하고, 그 뒤에는 Work 단위로 이어갑니다</title><desc id="desc">처음에는 Colvia를 설치하고 프로젝트 폴더에서 에이전트에게 연결을 요청한 뒤 미리보기를 확인합니다. 그 뒤에는 목표와 계획에서 후보를 고르고, Work마다 범위를 승인하고 결과를 수락한 다음 다음 할 일로 이어갑니다.</desc>
