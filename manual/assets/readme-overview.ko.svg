<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">설치와 연결, 새 일과 하던 일</title><desc id="desc">사용할 계정에 설치한 뒤 폴더마다 연결 내용을 확인하고 승인합니다. 새 일은 작업안을 보고 범위를 승인합니다. 제출본을 검토해 수락하거나 수정을 요청합니다. 하던 일은 프로젝트 현황에서 이어갑니다.</desc>
<style>
.bg{fill:#FAF9F6}.frame{fill:none;stroke:#E4E0D8}
.ink{fill:#2B2A27}.mut{fill:#6B675F}
.ln{fill:none;stroke:#9C968B;stroke-width:1.6}.lnd{fill:none;stroke:#B9B3A8;stroke-width:1.4;stroke-dasharray:5 5}
.ah{fill:#9C968B}
.agent{fill:#EEEBE4;stroke:#CFC9BE;stroke-width:1.2}
.col{fill:#1F5F5B}.colt{fill:#FFFFFF}.sym{fill:none;stroke:#FFFFFF;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.work{fill:#FFFFFF;stroke:#1F5F5B;stroke-width:1.6}.workt{fill:#1F5F5B}
.rec{fill:#E3EEEC;stroke:#1F5F5B;stroke-width:1.4}
.dec{fill:#D9822B}.dect{fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{fill:#FFFFFF;stroke:#CFC9BE;stroke-width:1.2}
.icon{fill:none;stroke:#2B2A27;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconf{fill:#2B2A27}
@media (prefers-color-scheme: dark){
.bg{fill:#22262A}.frame{stroke:#363B40}
.ink{fill:#ECE6DA}.mut{fill:#A9A397}
.ln{stroke:#8A857C}.lnd{stroke:#5F5B55}.ah{fill:#8A857C}
.agent{fill:#30353A;stroke:#4A5056}
.col{fill:#8CC6BC}.colt{fill:#13201E}.sym{stroke:#13201E}
.work{fill:#2A2F33;stroke:#8CC6BC}.workt{fill:#8CC6BC}
.rec{fill:#253330;stroke:#8CC6BC}
.dec{fill:#F0A35E}.dect{stroke:#22262A}
.note{fill:#2A2F33;stroke:#4A5056}
.icon{stroke:#ECE6DA}.iconf{fill:#ECE6DA}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ah"/></marker></defs>
<rect x="1" y="1" width="958" height="422" rx="16" class="bg"/><rect x="1" y="1" width="958" height="422" rx="16" class="frame"/>
<rect x="27" y="19" width="137" height="26" rx="8" class="rec"/>
<text x="95.5" y="32" text-anchor="middle" dominant-baseline="central" class="workt" font-size="16" font-weight="700">처음 연결할 때</text>
<rect x="52" y="70" width="40" height="26" rx="3" class="icon"/><path d="M44 102 H100" class="icon"/>
<text x="72" y="130" class="ink" font-size="13.5" font-weight="400" text-anchor="middle">계정에 설치</text>
