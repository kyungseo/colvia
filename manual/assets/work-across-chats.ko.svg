  [stroke="#A29684"] { stroke: #A99D8C; }
  [fill="#88755F"] { fill: #C4B299; }
  [fill="#8B7B66"] { fill: #B1A18C; }
  [stroke="#8B7B66"] { stroke: #B1A18C; }
  [stroke="#DCD8D0"] { stroke: #514D46; }
  [fill="#695B49"] { fill: #CBBBA4; }
  [fill="#786651"] { fill: #BEAA8F; }
  [stroke="#FCFAF6"] { stroke: #2C2822; }
}
