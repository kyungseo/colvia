<rect width="1200" height="470" rx="20" fill="#FAF9F6"/>
<path d="M20 0 H1180 Q1200 0 1200 20 V166 H0 V20 Q0 0 20 0Z" fill="#EEEBE4"/>
<g font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif">
<text x="44" y="40" font-size="16" font-weight="750" fill="#716452" letter-spacing="3">COLVIA</text>
<text x="42" y="100" font-size="40" font-weight="720" fill="#332F2B" >새 대화에서도 어제 쓰던 보고서를 이어 씁니다</text>
<text x="45" y="140" font-size="23" font-weight="450" fill="#5D5953" >팀장 피드백을 받아 다듬은 고객 문의 보고서</text>
<path d="M846 96 H1150" fill="none" stroke="#A29684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M862 96 C876 96 877 62 897 62 H911 C931 62 933 96 946 96" fill="none" stroke="#716452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="904" cy="62" r="4" fill="#88755F" stroke="none" stroke-width="0"/>
<path d="M960 96 C974 96 975 62 995 62 H1009 C1029 62 1031 96 1044 96" fill="none" stroke="#716452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1002" cy="62" r="4" fill="#88755F" stroke="none" stroke-width="0"/>
<path d="M1058 96 C1072 96 1073 62 1093 62 H1107 C1127 62 1129 96 1142 96" fill="none" stroke="#716452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1100" cy="62" r="4" fill="#88755F" stroke="none" stroke-width="0"/>
<text x="998" y="130" font-size="14" font-weight="650" fill="#635D55" text-anchor="middle" letter-spacing="1.2">한 작업의 기록</text>
<path d="M53 235 H1144" fill="none" stroke="#8B7B66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M419 270 V438" fill="none" stroke="#DCD8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M788 270 V438" fill="none" stroke="#DCD8D0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="45" y="212" font-size="21" font-weight="670" fill="#695B49" >월요일</text>
<circle cx="53" cy="235" r="9" fill="#FAF9F6" stroke="#8B7B66" stroke-width="3"/>
<circle cx="53" cy="235" r="3" fill="#8B7B66" stroke="none" stroke-width="0"/>
<text x="45" y="296" font-size="25" font-weight="670" fill="#383530" >초안을 검토하고</text>
<text x="45" y="348" font-size="24" font-weight="480" fill="#383530" >“지난달 문의 12건을 정리해 줘.</text>
<text x="45" y="383" font-size="24" font-weight="480" fill="#383530" >개선안은 내가 고를게.”</text>
<text x="45" y="434" font-size="17" font-weight="420" fill="#5D5953" >전체 12건 중 환불 문의는 5건입니다.</text>
<text x="439" y="212" font-size="21" font-weight="670" fill="#695B49" >수요일</text>
<circle cx="447" cy="235" r="9" fill="#FAF9F6" stroke="#8B7B66" stroke-width="3"/>
<circle cx="447" cy="235" r="3" fill="#8B7B66" stroke="none" stroke-width="0"/>
<text x="439" y="296" font-size="25" font-weight="670" fill="#383530" >바뀐 범위에서 다시 보고</text>
<text x="439" y="348" font-size="24" font-weight="480" fill="#383530" >“배송은 다른 팀이 맡기로 했어.</text>
<text x="439" y="383" font-size="24" font-weight="480" fill="#383530" >내가 고친 결론은 남겨 줘.”</text>
<text x="439" y="434" font-size="17" font-weight="420" fill="#5D5953" >배송 4건을 빼면 분모는 8건이 됩니다.</text>
<text x="808" y="212" font-size="21" font-weight="670" fill="#695B49" >금요일</text>
<circle cx="816" cy="235" r="9" fill="#FAF9F6" stroke="#8B7B66" stroke-width="3"/>
<circle cx="816" cy="235" r="3" fill="#8B7B66" stroke="none" stroke-width="0"/>
<text x="808" y="296" font-size="25" font-weight="670" fill="#383530" >회의에 쓸 결론을 고릅니다</text>
<text x="808" y="348" font-size="24" font-weight="480" fill="#383530" >“환불 건수는 그대로네.</text>
<text x="808" y="383" font-size="24" font-weight="480" fill="#383530" >이 설명으로 마무리하자.”</text>
<text x="808" y="434" font-size="17" font-weight="420" fill="#5D5953" >검토한 보고서와 결정이 함께 남습니다.</text>
<circle cx="1144" cy="235" r="12" fill="#786651" stroke="none" stroke-width="0"/>
<path d="M1138 235 l4 4 8 -9" fill="none" stroke="#FCFAF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>
