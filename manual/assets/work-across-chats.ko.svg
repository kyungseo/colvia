<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" xml:lang="ko"><title id="title">새 대화에서도 어제 쓰던 보고서를 이어 씁니다</title><desc id="desc">팀장 피드백을 받아 다듬은 고객 문의 보고서. 전체 12건 중 환불 문의는 5건입니다. 배송 4건을 빼면 분모는 8건이 됩니다. 검토한 보고서와 결정이 함께 남습니다.</desc>
<style>
