<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">2~8개 제출본과 통합 검사를 보고 함께 수락·반영</title><desc id="desc">macOS의 Claude Code CLI에서 에이전트가 작업자를 실행하고 결과를 모읍니다. 사용자는 2~8개 제출본과 통합 검사 결과를 보고 함께 수락·반영합니다.</desc>
