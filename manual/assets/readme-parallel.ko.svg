<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">분리된 공간에서 동시에 준비</title><desc id="desc">Colvia가 작업 공간을 나눠 각각 준비하고, 기준 공간에는 한 건씩 차례로 합칩니다.</desc>
<style>
