<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">도구를 바꿔도 이어가기</title><desc id="desc">월요일에 Codex에서 한 일이 Colvia를 거쳐 프로젝트 기록에 남고, 수요일에 Claude Code가 그 기록에서 이어갑니다.</desc>
