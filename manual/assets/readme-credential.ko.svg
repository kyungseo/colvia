<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, sans-serif">
<title id="title">Git 반영 전 자격증명 검사</title><desc id="desc">.env 추가·수정, 소스에 적은 AI API 키, .npmrc 인증 토큰을 Colvia가 로컬에서 검사하고 차단 위치를 알려 줍니다.</desc>
<style>
.bg{fill:#FAF9F6}.frame{fill:none;stroke:#E4E0D8}
.ink{fill:#2B2A27}.mut{fill:#6B675F}
.ln{fill:none;stroke:#9C968B;stroke-width:1.6}.lnd{fill:none;stroke:#B9B3A8;stroke-width:1.4;stroke-dasharray:5 5}
.ah{fill:#9C968B}
.agent{fill:#EEEBE4;stroke:#CFC9BE;stroke-width:1.2}
.col{fill:#1F5F5B}.colt{fill:#FFFFFF}.sym{fill:none;stroke:#FFFFFF;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.work{fill:#FFFFFF;stroke:#1F5F5B;stroke-width:1.6}.workt{fill:#1F5F5B}
.rec{fill:#E3EEEC;stroke:#1F5F5B;stroke-width:1.4}
.note{fill:#FFFFFF;stroke:#CFC9BE;stroke-width:1.2}
.icon{fill:none;stroke:#2B2A27;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#22262A}.frame{stroke:#363B40}
.ink{fill:#ECE6DA}.mut{fill:#A9A397}
.ln{stroke:#8A857C}.lnd{stroke:#5F5B55}.ah{fill:#8A857C}
.agent{fill:#30353A;stroke:#4A5056}
.col{fill:#8CC6BC}.colt{fill:#13201E}.sym{stroke:#13201E}
.work{fill:#2A2F33;stroke:#8CC6BC}.workt{fill:#8CC6BC}
.rec{fill:#253330;stroke:#8CC6BC}
.note{fill:#2A2F33;stroke:#4A5056}
.icon{stroke:#ECE6DA}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ah"/></marker></defs>
<rect x="1" y="1" width="358" height="208" rx="16" class="bg"/><rect x="1" y="1" width="358" height="208" rx="16" class="frame"/>
<rect x="12" y="22" width="104" height="53" rx="7" class="note"/>
<text x="64" y="41" text-anchor="middle" class="ink" font-size="15" font-weight="700">.env</text>
<text x="64" y="60" text-anchor="middle" class="mut" font-size="13">추가·수정</text>
<rect x="128" y="22" width="104" height="53" rx="7" class="note"/>
<text x="180" y="41" text-anchor="middle" class="ink" font-size="15" font-weight="700">app.py</text>
<text x="180" y="60" text-anchor="middle" class="mut" font-size="13">AI API 키</text>
<rect x="244" y="22" width="104" height="53" rx="7" class="note"/>
<text x="296" y="41" text-anchor="middle" class="ink" font-size="15" font-weight="700">.npmrc</text>
<text x="296" y="60" text-anchor="middle" class="mut" font-size="13">인증 토큰</text>
<path d="M180 76 V93 Q180 99 174 99 H64 M296 76 V93 Q296 99 290 99 H180" class="ln"/>
<path d="M64 76 V115" class="ln" marker-end="url(#ah)"/>
<rect x="15" y="121" width="98" height="41" rx="9" class="col"/>
<g transform="translate(20,129) scale(0.2812)"><path d="M27.9 45.7 A14 14 0 1 1 22 19 C29 19 31 30 36.5 30 C42 30 44 21 49.5 21 L56 21" class="sym"/></g>
<text x="78" y="146" class="colt" font-size="14" font-weight="600" text-anchor="middle">Colvia</text>
<text x="64" y="185" text-anchor="middle" class="mut" font-size="13">로컬 검사</text>
<path d="M116 142 H158" class="ln" marker-end="url(#ah)"/>
<rect x="164" y="117" width="183" height="69" rx="9" class="rec"/>
<path d="M183 133 H192 L198 139 V148 L192 154 H183 L177 148 V139 Z M182 144 H193" class="icon"/>
<text x="269" y="148" text-anchor="middle" class="workt" font-size="15" font-weight="700">커밋 준비 중단</text>
<text x="269" y="171" text-anchor="middle" class="mut" font-size="12">예: .npmrc 2행</text>
</svg>
