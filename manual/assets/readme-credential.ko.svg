<svg xmlns="http://www.w3.org/2000/svg" width="640" height="218" viewBox="0 0 640 218" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, sans-serif">
<title id="title">Git 반영 전 자격증명 검사</title><desc id="desc">.env 추가·수정, 소스에 적은 AI API 키, .npmrc 인증 토큰을 Colvia가 로컬에서 검사하고 차단 위치를 알려 줍니다.</desc>
<style>
.bg{fill:#FAF9F6}.frame{fill:none;stroke:#E4E0D8}
.ink{fill:#2B2A27}.mut{fill:#6B675F}
.ln{fill:none;stroke:#9C968B;stroke-width:1.6}.lnd{fill:none;stroke:#B9B3A8;stroke-width:1.4;stroke-dasharray:5 5}
.ah{fill:#9C968B}
.agent{fill:#EEEBE4;stroke:#CFC9BE;stroke-width:1.2}
.col{fill:#1F5F5B}.colt{fill:#FFFFFF}.sym{fill:none;stroke:#FFFFFF;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.work{fill:#FFFFFF;stroke:#1F5F5B;stroke-width:1.6}.workt{fill:#1F5F5B}
.rec{fill:#E3EEEC;stroke:#1F5F5B;stroke-width:1.4}
.note{fill:#FFFFFF;stroke:#CFC9BE;stroke-width:1.2}
.icon{fill:none;stroke:#2B2A27;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#22262A}.frame{stroke:#363B40}
.ink{fill:#ECE6DA}.mut{fill:#A9A397}
.ln{stroke:#8A857C}.lnd{stroke:#5F5B55}.ah{fill:#8A857C}
.agent{fill:#30353A;stroke:#4A5056}
.col{fill:#8CC6BC}.colt{fill:#13201E}.sym{stroke:#13201E}
.work{fill:#2A2F33;stroke:#8CC6BC}.workt{fill:#8CC6BC}
.rec{fill:#253330;stroke:#8CC6BC}
.note{fill:#2A2F33;stroke:#4A5056}
.icon{stroke:#ECE6DA}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ah"/></marker></defs>
<rect x="1" y="1" width="638" height="216" rx="15" class="bg"/><rect x="1" y="1" width="638" height="216" rx="15" class="frame"/>
<rect x="18" y="15" width="207" height="55" rx="7" class="note"/>
<path d="M36 27 H48 L54 33 V50 H36 Z M48 27 V33 H54 M40 40 H49" class="icon"/>
<text x="67" y="33" class="ink" font-size="14" font-weight="700">.env</text>
<text x="67" y="50" class="mut" font-size="12">보호 파일 추가·수정</text>
<rect x="18" y="81" width="207" height="55" rx="7" class="note"/>
<path d="M41 91 L35 97 L41 103 M49 91 L55 97 L49 103" class="icon"/>
<text x="67" y="99" class="ink" font-size="14" font-weight="700">app.py</text>
<text x="67" y="116" class="mut" font-size="12">AI API 키 직접 입력</text>
<rect x="18" y="147" width="207" height="55" rx="7" class="note"/>
<path d="M35 164 a6 6 0 1 1 12 0 a6 6 0 1 1 -12 0 M47 164 H57 V169 M53 164 V168" class="icon"/>
<text x="67" y="165" class="ink" font-size="14" font-weight="700">.npmrc</text>
<text x="67" y="182" class="mut" font-size="12">인증 토큰 직접 입력</text>
<path d="M225 42 H244 Q252 42 252 50 V168 Q252 175 244 175 H225" class="ln"/>
<path d="M225 109 H277" class="ln" marker-end="url(#ah)"/>
<rect x="286" y="90" width="106" height="38" rx="9" class="col"/>
<g transform="translate(293,98) scale(0.2812)"><path d="M27.9 45.7 A14 14 0 1 1 22 19 C29 19 31 30 36.5 30 C42 30 44 21 49.5 21 L56 21" class="sym"/></g>
<text x="348" y="112" class="colt" font-size="14" font-weight="600" text-anchor="middle">Colvia</text>
<text x="339" y="151" text-anchor="middle" class="mut" font-size="13">로컬 검사</text>
<path d="M397 109 H431" class="ln" marker-end="url(#ah)"/>
<rect x="441" y="51" width="178" height="115" rx="9" class="rec"/>
