<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Pick up your report in a new chat</title><desc id="desc">One week with a customer inquiry report. Five of the twelve are refund questions. Four fewer inquiries, still five about refunds. Your decision stays with the report.</desc>
