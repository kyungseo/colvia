<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc" xml:lang="ko" font-family="Pretendard, system-ui, -apple-system, Segoe UI, sans-serif"><title id="title">결과가 준비되면 알림</title><desc id="desc">에이전트가 준비한 결과를 Colvia가 제출하고 기기 알림을 보내며, 사람은 알림에서 Work를 열어 직접 수락합니다.</desc>
