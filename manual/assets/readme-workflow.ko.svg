<rect x="20" y="80" width="172" height="70" rx="8" class="work"/>
<text x="106" y="104" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" class="workt">범위 승인</text>
<text x="106" y="132" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" class="mut">제안받은 계획</text>
